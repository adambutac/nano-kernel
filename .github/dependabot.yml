# Keeps the SHA-pinned actions in .github/workflows/ current. Dependabot
# updates the SHA and the trailing tag comment together. One grouped PR a week
# at most, so a bump arrives as a single reviewable change.
#
# The owner reviews a Dependabot PR by checking that each new SHA is the tagged
# commit in the action's own repository (a fork's commit also resolves under
# the upstream name), reading the release notes, and waiting for green CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
